name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate metadata
        id: metadata
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            IS_RELEASE=true
          else
            VERSION="sha-${SHORT_SHA}"
            IS_RELEASE=false
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"
          echo "IS_RELEASE=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Lowercase repository owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image
        run: |
          docker build \
            -t random-images-api:latest \
            -t random-images-api:${{ steps.metadata.outputs.VERSION }} .

      - name: Export release image
        if: steps.metadata.outputs.IS_RELEASE == 'true'
        run: |
          mkdir -p docker-images
          docker save random-images-api:${{ steps.metadata.outputs.VERSION }} \
            -o docker-images/image-${{ steps.metadata.outputs.VERSION }}.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        env:
          GHCR_IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/random-images-api
        run: |
          docker tag random-images-api:latest "${GHCR_IMAGE}:latest"
          docker tag random-images-api:${{ steps.metadata.outputs.VERSION }} "${GHCR_IMAGE}:${{ steps.metadata.outputs.VERSION }}"
          docker push "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${{ steps.metadata.outputs.VERSION }}"

      - name: Create GitHub release
        if: steps.metadata.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.metadata.outputs.VERSION }}
          body: |
            ### 构建信息
            - **版本**: ${{ steps.metadata.outputs.VERSION }}
            - **时间**: ${{ steps.metadata.outputs.BUILD_DATE }}
            - **提交**: [${{ steps.metadata.outputs.SHORT_SHA }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ### 镜像使用
            ```bash
            docker pull ghcr.io/${{ steps.owner.outputs.name }}/random-images-api:${{ steps.metadata.outputs.VERSION }}
            ```
          files: docker-images/image-${{ steps.metadata.outputs.VERSION }}.tar
