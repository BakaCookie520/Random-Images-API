<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>初始化管理员</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body><main class="auth-page"><section class="auth-box">
    <div class="topbar__actions auth-head"><a class="brand" href="{{ url_for('main.serve_main_page') }}"><span class="brand__mark">RI</span><span class="brand__text"><strong class="brand__title">首次设置</strong><span class="brand__subtitle">admin</span></span></a><button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button></div>
    <h1>设置管理员密码</h1><p>密码用于访问后台上传、删除和管理图片集合。</p>
    {% if error %}<div class="error-text">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin.setup') }}"><div class="field"><label for="password">新密码</label><input id="password" name="password" type="password" autocomplete="new-password" required></div><div class="field stacked-field"><label for="confirm_password">确认密码</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div><div class="actions form-actions"><button class="btn btn--primary" type="submit">设置密码</button><a class="btn btn--secondary" href="{{ url_for('main.serve_main_page') }}">返回首页</a></div></form>
</section></main></body>
</html>
