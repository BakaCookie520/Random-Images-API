<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>管理员登录</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body><main class="auth-page"><section class="auth-box">
    <div class="topbar__actions auth-head"><a class="brand" href="{{ url_for('main.serve_main_page') }}"><span class="brand__mark">RI</span><span class="brand__text"><strong class="brand__title">管理员登录</strong><span class="brand__subtitle">admin</span></span></a><button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button></div>
    <h1>登录后台</h1><p>输入管理员密码后继续管理图片集合。</p>
    {% if error %}<div class="error-text">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin.login') }}"><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div class="actions form-actions"><button class="btn btn--primary" type="submit">登录</button><a class="btn btn--secondary" href="{{ url_for('main.serve_main_page') }}">返回首页</a></div></form>
</section></main></body>
</html>
