<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder }} - 图片浏览</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<div class="app-shell">
    <header class="topbar"><div class="topbar__inner">
        <a class="brand" href="{{ url_for('main.serve_main_page') }}"><span class="brand__mark">RI</span><span class="brand__text"><strong class="brand__title">{{ folder }}</strong><span class="brand__subtitle">图片浏览</span></span></a>
        <nav class="topbar__actions" aria-label="浏览导航"><a class="btn btn--secondary" href="{{ url_for('main.serve_main_page') }}">首页</a><a class="btn btn--primary" href="{{ url_for('images.serve_sequential_image', folder=folder) }}">随机</a><button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button></nav>
    </div></header>
    <main class="page">
        <section class="section-head"><div><p class="eyebrow">Collection</p><h1>{{ folder }}</h1><p>{{ images|length }} 张图片，可点击缩略图查看大图。</p></div></section>
        {% if images %}
        <div class="grid">
            {% for image in images %}
            <article class="image-card">
                <button class="image-card__preview" type="button" data-lightbox="{{ url_for('images.serve_image', folder=folder, filename=image) }}" data-name="{{ image }}"><img src="{{ url_for('images.serve_image', folder=folder, filename=image) }}" alt="{{ image }}" loading="lazy"></button>
                <div class="image-card__body"><h2 class="item-title">{{ image }}</h2><p class="item-meta">点击预览原图</p></div>
            </article>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-state"><div><h2>这个集合还是空的</h2><p>上传图片后，这里会显示可浏览的缩略图。</p><div class="actions center-actions"><a class="btn btn--primary" href="{{ url_for('admin.view_folder', folder_name=folder) }}">去上传</a></div></div></div>
        {% endif %}
    </main>
</div>
<div class="modal lightbox" data-lightbox-modal aria-hidden="true"><div class="modal__dialog" role="dialog" aria-modal="true" aria-label="图片预览"><img data-lightbox-image alt=""><div class="lightbox__bar"><button class="btn btn--secondary" type="button" data-lightbox-prev>上一张</button><div><strong data-lightbox-label></strong> <span data-lightbox-counter></span></div><div class="actions"><button class="btn btn--secondary" type="button" data-lightbox-next>下一张</button><button class="btn btn--danger" type="button" data-lightbox-close>关闭</button></div></div></div></div>
</body>
</html>
