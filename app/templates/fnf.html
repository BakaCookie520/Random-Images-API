<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>404 - 页面未找到</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body><main class="status-page"><section class="status-box">
    <div class="topbar__actions auth-head"><a class="brand" href="{{ url_for('main.serve_main_page') }}"><span class="brand__mark">RI</span><span class="brand__text"><strong class="brand__title">Random Images API</strong><span class="brand__subtitle">页面未找到</span></span></a><button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button></div>
    <div class="status-code">404</div><h1>没有找到这个资源</h1><p>路径可能不存在，或图片集合还没有创建。</p>
    {% if subfolders %}<div class="pill-list" aria-label="可访问集合">{% for folder in subfolders %}<a class="pill" href="{{ url_for('images.serve_sequential_image', folder=folder) }}">{{ folder }}</a>{% endfor %}</div>{% endif %}
    <div class="actions form-actions"><a class="btn btn--primary" href="{{ url_for('main.serve_main_page') }}">返回首页</a><a class="btn btn--secondary" href="{{ url_for('images.serve_random_from_all') }}">全局随机</a></div>
</section></main></body>
</html>
