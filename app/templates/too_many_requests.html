<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>429 - 请求过于频繁</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body><main class="status-page"><section class="status-box">
    <div class="topbar__actions auth-head"><a class="brand" href="{{ url_for('main.serve_main_page') }}"><span class="brand__mark">RI</span><span class="brand__text"><strong class="brand__title">访问受限</strong><span class="brand__subtitle">请求频率保护</span></span></a><button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button></div>
    <div class="status-code">429</div><h1>请求过于频繁</h1><p>请稍后再访问目标资源。</p>
    <ul class="status-list"><li><span>IP 地址</span><strong>{{ client_ip }}</strong></li><li><span>目标 URL</span><strong>{{ target_url }}</strong></li><li><span>解封时间</span><strong>{{ end_time|int|datetime }}</strong></li><li><span>剩余时间</span><strong><span data-countdown>{{ retry_after|int }}</span> 秒</strong></li></ul>
    <div class="actions form-actions"><a class="btn btn--primary" href="{{ url_for('main.serve_main_page') }}">返回首页</a></div>
</section></main></body>
</html>
